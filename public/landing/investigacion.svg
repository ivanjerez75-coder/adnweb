  <circle cx="240" cy="118" r="5" stroke="#0F766E" stroke-width="2"/>
  <rect x="254" y="114" width="110" height="8" rx="4" fill="#DADADA"/>

  <!-- Contenido de la página -->
  <rect x="160" y="176" width="250" height="22" rx="6" fill="#393939"/>
  <rect x="160" y="208" width="170" height="22" rx="6" fill="#393939"/>

  <rect x="160" y="252" width="440" height="10" rx="5" fill="#DADADA"/>
