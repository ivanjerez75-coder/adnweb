<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="960" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6F2F1"/>
      <stop offset="1" stop-color="#F3F3F3"/>
    </linearGradient>
    <filter id="difuso" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#393939" flood-opacity="0.12"/>
    </filter>
    <clipPath id="ventana">
      <rect x="120" y="92" width="560" height="420" rx="22"/>
    </clipPath>
  </defs>

  <rect width="960" height="600" fill="url(#fondo)"/>
  <circle cx="190" cy="120" r="130" fill="#C9B8F5" opacity="0.45" filter="url(#difuso)"/>
  <circle cx="820" cy="470" r="150" fill="#9EE6CF" opacity="0.5" filter="url(#difuso)"/>
  <circle cx="560" cy="300" r="120" fill="#0F766E" opacity="0.12" filter="url(#difuso)"/>

  <!-- Ventana del navegador -->
  <g filter="url(#sombra)">
    <rect x="120" y="92" width="560" height="420" rx="22" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#ventana)">
    <rect x="120" y="92" width="560" height="52" fill="#F3F3F3"/>
    <rect x="120" y="143" width="560" height="1" fill="#DADADA"/>
  </g>
  <rect x="120.5" y="92.5" width="559" height="419" rx="21.5" stroke="#DADADA"/>
  <circle cx="148" cy="118" r="6" fill="#DADADA"/>
