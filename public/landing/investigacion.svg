  <rect x="456" y="416" width="86" height="8" rx="4" fill="#DADADA"/>
  <rect x="456" y="432" width="70" height="8" rx="4" fill="#DADADA"/>

  <!-- Lupa sobre la línea resaltada -->
  <circle cx="560" cy="289" r="46" fill="#FFFFFF" fill-opacity="0.35" stroke="#393939" stroke-width="10"/>
  <path d="M594 323 L632 361" stroke="#393939" stroke-width="16" stroke-linecap="round"/>

  <!-- Conectores hacia las pruebas -->
