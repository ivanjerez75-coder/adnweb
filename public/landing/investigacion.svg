  <rect x="440" y="378" width="122" height="96" rx="12" fill="#F3F3F3" stroke="#DADADA"/>
  <rect x="176" y="396" width="56" height="10" rx="5" fill="#393939" opacity="0.7"/>
  <rect x="176" y="416" width="86" height="8" rx="4" fill="#DADADA"/>
  <rect x="176" y="432" width="70" height="8" rx="4" fill="#DADADA"/>
